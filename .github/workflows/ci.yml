name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Las pruebas simulan EasyOCR, así que se omite (evita descargar PyTorch).
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          grep -v '^easyocr' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Ejecutar pytest
        run: pytest -q

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      # PRELOAD_MODELS=0 acelera la CI; la imagen de producción descarga los modelos al construir.
      - name: Construir imagen
        run: docker build --build-arg PRELOAD_MODELS=0 -t digitalizador-boletas:ci .

      - name: Arrancar y comprobar salud
        run: |
          docker run -d --name app -p 8501:8501 digitalizador-boletas:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Comprobar que la app importa sus módulos
        run: docker exec app python -c "import ui, ocr_service, receipt_service, repository, auth_service, easyocr; print('ok')"
