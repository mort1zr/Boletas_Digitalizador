name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Las pruebas simulan el OCR, así que se omiten PaddlePaddle y PaddleOCR (evita ~700 MB).
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          grep -v '^paddle' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Ejecutar pytest
        run: pytest -q

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      # Se construye con los modelos de PaddleOCR (unos 13 MB) para probar también esa descarga.
      - name: Construir imagen
        run: docker build -t digitalizador-boletas:ci .

      - name: Arrancar y comprobar salud
        run: |
          docker run -d --name app -p 8501:8501 digitalizador-boletas:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Comprobar que la app importa sus módulos
        run: docker exec app python -c "import ui, ocr_service, receipt_service, repository, auth_service, paddleocr; print('ok')"

      - name: Leer una imagen con PaddleOCR dentro del contenedor
        run: |
          docker exec app python -c "
          import cv2, numpy as np, ocr_service
          img = np.full((300, 1000), 255, np.uint8)
          cv2.putText(img, 'TOTAL A PAGAR S/ 118.00', (30, 150), cv2.FONT_HERSHEY_SIMPLEX, 1.6, 0, 3)
          lines, raw = ocr_service.run_ocr(img)
          print(repr(raw))
          assert '118' in raw.replace(' ', ''), raw
          "
