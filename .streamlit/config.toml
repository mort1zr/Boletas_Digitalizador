[server]
# Coincide con MAX_UPLOAD_BYTES (10 MB): Streamlit rechaza archivos mayores
# antes de cargarlos en memoria. Por defecto Streamlit acepta hasta 200 MB.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Oculta el botón «Deploy» y el menú de desarrollo de Streamlit en la app publicada.
toolbarMode = "minimal"
